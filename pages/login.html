<!DOCTYPE html>
<html lang="sq">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Hyr në Healthy Me." />
    <title>Healthy Me | Hyr</title>
    <link rel="stylesheet" href="../assets/css/base.css" />
    <link rel="stylesheet" href="../assets/css/layout.css" />
    <link rel="stylesheet" href="../assets/css/components.css" />
    <link rel="stylesheet" href="../assets/css/forms.css" />
  </head>
  <body>
    <header class="site-header">
      <nav class="site-navigation" aria-label="Navigimi kryesor">
        <a class="brand" href="../index.html" aria-label="Healthy Me, faqja kryesore">Healthy Me</a>
        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="main-menu">Menu</button>
        <ul class="navigation-list" id="main-menu">
          <li><a href="../index.html">Kryefaqja</a></li>
          <li><a href="wellbeing.html">Mirëqenia</a></li>
          <li><a href="hydration.html">Hidratimi</a></li>
          <li><a href="movement.html">Lëvizja</a></li>
          <li><a class="active" href="login.html" aria-current="page">Hyr</a></li>
          <li><a href="register.html">Regjistrohu</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section class="form-section" aria-labelledby="login-title">
        <div class="form-intro">
          <p class="eyebrow">Mirë se u ktheve</p>
          <h1 id="login-title">Hyr në Healthy Me</h1>
          <p>Hyr për të vazhduar udhëtimin tënd drejt zakoneve më të mira.</p>
        </div>
        <form class="account-form" id="login-form" novalidate>
          <div class="form-field">
            <label for="login-email">Email</label>
            <input id="login-email" name="email" type="email" autocomplete="email" required />
          </div>
          <div class="form-field">
            <label for="login-password">Fjalëkalimi</label>
            <div class="password-field">
              <input id="login-password" name="password" type="password" autocomplete="current-password" required />
              <button class="password-toggle" type="button" data-password-toggle="login-password">Shfaq</button>
            </div>
          </div>
          <label class="checkbox-field">
            <input name="remember" type="checkbox" />
            Më mbaj të kyçur
          </label>
          <button class="button" type="submit">Hyr</button>
          <p class="form-message" aria-live="polite"></p>
        </form>
        <p>Nuk ke llogari? <a href="register.html">Regjistrohu</a>.</p>
      </section>
    </main>

    <footer class="site-footer"><p>&copy; 2026 Healthy Me. Hapa të vegjël, ndryshime të mëdha.</p></footer>
    <script src="../assets/js/navigation.js"></script>
    <script src="../assets/js/forms.js"></script>
  </body>
</html>
